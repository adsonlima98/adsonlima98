name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1B3A5C&color_dots=#EBEDF0,#C6DBEF,#8FB8DE,#5FA8D3,#1B3A5C
            dist/github-snake-dark.svg?color_snake=#5FA8D3&color_dots=#161B22,#12304F,#1B4A73,#2F6FA3,#5FA8D3

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
